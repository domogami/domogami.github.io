name: Validate Quartz 5 migration

on:
  push:
    branches:
      - v5-migration-2026-08-03
  pull_request:
    branches:
      - Quartz4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Generate Quartz plugin index
        run: npm run install-plugins
      - name: Type-check Quartz
        run: npx tsc --noEmit
      - name: Check migration-owned formatting
        run: >-
          npx prettier quartz.config.yaml quartz/styles/custom.scss
          .github/workflows/validate-migration.yml .github/workflows/deploy.yml --check
      - name: Build Quartz
        run: npx quartz build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v6
        with:
          name: quartz-v5-public
          path: public
          if-no-files-found: error
