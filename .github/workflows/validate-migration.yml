name: Validate Quartz 5

on:
  pull_request:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install --from-config
      - name: Generate Quartz plugin index
        run: npm run install-plugins
      - name: Type-check Quartz
        run: npx tsc --noEmit
      - name: Check migration-owned formatting
        run: >-
          npx prettier quartz.config.yaml quartz/styles/custom.scss
          .github/workflows/validate-migration.yml .github/workflows/deploy.yml --check
      - name: Build Quartz
        run: npx quartz build
      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: quartz-v5-public
          path: public
          if-no-files-found: error
