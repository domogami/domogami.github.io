configuration:
  pageTitle: Dom Lee
  pageTitleSuffix: ""
  enableSPA: false
  enablePopovers: true
  analytics:
    provider: plausible
  locale: en-US
  baseUrl: domogami.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - Personal
    - 00 - Personal
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Poppins
      body: Lexend
      code: IBM Plex Mono
      title: Poppins
    colors:
      lightMode:
        light: "#efe7d7"
        lightgray: "#cfc5b4"
        gray: "#77756f"
        darkgray: "#414748"
        dark: "#252b2e"
        secondary: "#0e7c79"
        tertiary: "#a34e36"
        highlight: rgba(14, 124, 121, 0.08)
        textHighlight: rgba(67, 208, 193, 0.24)
      darkMode:
        light: "#2b3034"
        lightgray: "#50565a"
        gray: "#aaa79f"
        darkgray: "#ded7ca"
        dark: "#efe7d7"
        secondary: "#b6cf8e"
        tertiary: "#e6b78d"
        highlight: rgba(182, 207, 142, 0.10)
        textHighlight: rgba(182, 207, 142, 0.24)
plugins:
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: googleFonts
      header:
        name: Poppins
        weights:
          - 400
          - 600
          - 700
      body:
        name: Lexend
        weights:
          - 300
          - 400
          - 600
      code: IBM Plex Mono
      interface: IBM Plex Mono
      title:
        name: Poppins
        weights:
          - 600
          - 700
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: ./site/flower-hunt/plugin
    enabled: true
    options:
      id: personal-growth-v1
      hiddenPaths:
        - my-experiences/open-personal-growth
      destination: my-experiences/open-personal-growth
      pieces:
        - id: beginnings
          page: my-experiences/college-at-ucsd
          label: The beginnings petal
          anchor: life-at-warren-college
          afterParagraph: 1
          message: A little something is growing here…
        - id: making
          page: my-experiences/working-at-amazon
          label: The making petal
          anchor: how-it-started
          afterParagraph: 1
        - id: change
          page: my-experiences/watch-party
          label: The change petal
          anchor: why-this-features-matters-to-me
          afterParagraph: 1
        - id: curiosity
          page: my-experiences/rabbit-holes
          label: The curiosity petal
          anchor: why-rabbit-holes-are-important-to-me
          afterParagraph: 1
          message: Follow your curiosity…
        - id: light
          page: influential-works/lighthouse-poem
          label: The light petal
          afterParagraph: 1
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    # Use the shared plant banner through Quartz's standard static image fallback.
    # Source: quartz/static/garden-preview.svg; regenerate with npm run site:social-image.
    enabled: false
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: ./site/notebook/plugins/notebook-graph
    enabled: true
    options:
      localGraph:
        drag: true
        zoom: true
        depth: 2
        scale: 0.95
        repelForce: 0.35
        centerForce: 0.3
        linkDistance: 40
        fontSize: 0.7
        opacityScale: 0.2
        removeTags: []
        showTags: true
        focusOnHover: true
        enableRadial: false
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.9
        repelForce: 0.5
        centerForce: 0.3
        linkDistance: 60
        fontSize: 0.6
        opacityScale: 0.2
        removeTags: []
        showTags: true
        focusOnHover: true
        enableRadial: false
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
      condition: has-tags
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        Personal Site: https://dominicklee.net
        GitHub: https://github.com/domogami/domogami.github.io
        Linkedin: https://www.linkedin.com/in/domogami/
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: ./site/notebook/plugins/notebook-brand
    enabled: true
    layout:
      position: left
      priority: 10
  - source: ./site/notebook/plugins/notebook-theme
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: ./site/notebook/plugins/notebook-motion
    enabled: true
    layout:
      position: footer
      priority: 90
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
        - "@quartz-community/table-of-contents"
        - "@quartz-community/backlinks"
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
